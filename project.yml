name: MonopolyIPad
options:
  bundleIdPrefix: com.monopolycash
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: NO
targets:
  MonopolyIPad:
    type: application
    platform: iOS
    sources:
      - path: MonopolyIPad
        excludes:
          - "**/*.md"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MonopolyIPad/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.monopolycash.ipad
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - MonopolyIPadTests
  MonopolyIPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MonopolyIPadTests
    dependencies:
      - target: MonopolyIPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monopolycash.ipad.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
